 Cuban_Decision_1_tt:0 "We shall set to work investing in §1Cubanacan§!.\n\nThis decision has the following effects:\n\nAn equal chance to build either a §GCivilian Factory§!, a §GMilitary Factory§! or a §GLevel of Infrastructure§! in the state of §1Cubanacan§!.\n\nWe will also remove 10 §RAnger§! and receive 1 §RAction§!.\n\nThere is also a small chance of a §GMiracle§! where we will build all three at once for the price of one. And remove 30 §RAnger§! from the score and 3 §RActions§! taken.\n\n§GThis decision can be taken once every 120 days§!."



 ### FZS Crisis Decisions

 FZS_CW_Decisions:0 "The Beakavian Emergency"
 FZS_CW_Decisions_desc:0 "To the West of Beakavia, the ungrateful §OZebrikaangriffs§! have declared the Governance of Jan Hoorst to be illegitimate, citing corruption, greed and all other nonsense that comes from such disorganized dullards. \n\nIn order for us to §GRestore Order, Authority & Achieve our future Prospects..§! we must utilize all of our '§RAssets§!' to our advantage.\n\nSome methods may prove... §RControversial§!, but Businessgriffs are quick to forget when there's §GProfit to be Made!§!\n\n\nThe §OZebrikaaners§! Current Strength: §R[?ROOT.FZS_Strength_Meter]§!\n\nGetting their Strength to §R0§! will end the Crisis and §CRestore Zebridischer Control Over the Zebrides!§!\n\nHover over the §gRound Crisis Mission§! for details on how to end the §REmergency§!."

 FZS_Strength_Check:0 "Round Duration"
 FZS_Strength_Check.desc:0 "If we have already invested this round, the §OZebrikaaners§! will lose §R1§! §CRevolt Strength.§! \n\nIf we fail to invest in the round, the §OZebrikaaners§! will gain §R1§! §CRevolt Strength§!."


 #### Storm Regency Intervention Decisions ####

 Storm_Kingdom_Investment_Decisions:0 "Intervention in the §5Rainband§!"
 Storm_Kingdom_Investment_Decisions_desc:0 "With the passing of the §RStorm King§! in his unfortunate folly, the seat of his Power, the Rainband - has collapsed into multiple Successor States of varying legitimacy.\n\nA Warlock, A confused Storm Creature, An armchair General relying on the good will of Zebras...\n\nAnd in the seat of Power, the §4Eye of the Storm§!, §5Ikvus Hailstorm§! sits atop the traditional throne and one of the most secure positions for our investments.\n\nIt is to our distinct advantage to keep him content so we may call in our Investments at a later date. §7Or perhaps, convene something greater; should we play our cards right.§!\n\n§5Ikvus Hailstorm's§! currently §G[ROOT.Get_Ikvus_Happiness]§!."

 StormKing_Decision_0:0 "Intelligence Report: §5Ikvus Hailstorm§!"

 Ikvus_Intelligence_Report_tt:0 "The most valuable Weapon in any Conflict is §2Information§!.\n\nWe shall dispatch an agent to the Eye of the Storm to see just how the new '§4Storm King§!' operates under duress."


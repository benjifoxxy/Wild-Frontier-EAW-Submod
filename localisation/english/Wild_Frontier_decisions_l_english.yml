 ### Cubanacan Crisis Decisions

 Cuban_Anger_Map_Area_tt:0 "Click to Jump to §1Cubanacan§!"

 Cubanacan_Anger_Decisions:0 "§1Cubanacan Fury!§!"
 Cubanacan_Anger_Decisions_desc:0 "Todo mission of Native co operation\n\nCurrent Cabanacan §RAnger§! is §7[?ROOT.Cuban_Anger]§!% out of a maximum of §7100%§!\n\nWe have currently taken §R[?ROOT.Cuban_Actions]§! Actions to appease them.\n\ntodo decision"


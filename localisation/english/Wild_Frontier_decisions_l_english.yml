 Secure_Ceram:0 "Checking in with Ceram"
 Secure_Ceram_desc:0 "The Island of Ceram has always been considered loyal to it's Protectors in Beakavia... perhaps we should remind them of our continued friendship."

 Secure_Kirchau:0 "The Kirchau Question"
 Secure_Kirchau_desc:0 "The self-proclaimed Admiral of the Kirchau Governate has always been a crook wearing a uniform. If we are to remain in control of the situation, we should handle him quickly."

 Secure_Sambo:0 "Nacre Nuance"
 Secure_Sambo_desc:0 "The now subjugated Thalossacracy of Sambovato seems happy to take the opportunity to ignore our officials given the turbulent situation. Perhaps it's time to finally end the farce here and now."
 

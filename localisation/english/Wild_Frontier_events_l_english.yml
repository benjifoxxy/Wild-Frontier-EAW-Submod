 zebstart.4.t:0 "The Land of Enchantment"

 zebstart.4.d:0 "The Grand Hall is a spectacle that dazzles everygriff it seats.\n\nEnchanted by mystique and history. It was here, Isaac regarded with a warm smile, that the famed Kommodore van Zebridehoff is said to have planted the first seeds of civilization on what was called by the Natives as ‘Boyano’.\n\nAn agreement between the Boyano and the Feathisian Zebridehoff established a Protectorate over the South of Zebrika.\n\nThat first meeting.. An open, protective claw ensuring the edification of the Zebras under the Kommodores protection. And by extent, the Emperor’s blessing.\n\nThat beacon, the mantle of responsibility passed down from the Kommodore down to each of his successors, and now, here Isaac was; appointed by the Emperor himself out of friendship and merit. What more could an eldergriff want…\n\n“Ah, Governor!”\n\nThe shimmer of light that entranced the Governor broke as he turned to the trio of well dressed patrons that had entered the hall. Zebrikaaners, by the look of the Orange napkins tucked neatly into their pinstripe suits.\n\nIsaac’s surprise quickly turned into a jovial embrace, an open palm beckoning to the bar, the eager clerk waiting to take their orders, not that it would be their only drinks for the night…"

 zebstart.4.a:0 "To the Kommodore! And to Grover V's continued good health!"




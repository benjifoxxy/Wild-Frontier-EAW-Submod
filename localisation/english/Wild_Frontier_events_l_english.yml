 zebstart.1.t:0 "Old vs New"

 zebstart.1.d:0 "All was silent for what felt like eternity. But was in reality, but fifteen precious seconds before the possibilities of warfare were forever changed.\n\nFifteen seconds of dread, of the Civility of the Old World back in Griffonia, to perhaps reach out it’s Sharp Talons and squash out the flame of innovation.\n\nFifteen seconds of hope, of the Wild Ambition of the New World in Zebrika, to hold open it’s welcoming embrace, to all who would dare to dream.\n\nWhich followed, with a distant flash of light.\n\nThe crowd gasped, as the flash gave way to a gust of force that knocked one of the Polizeigriffs clean off his feet."

 zebstart.1.a:0 "And the good Doctor taking flight to the great gust, as if it was his true calling for the Sky."



 zebstart.2.t:0 "The Good Doctor"

 zebstart.2.d:0 "Dr. Isidor was always a Griff with an eye for the intricate.\n\nBut when one is to present to the Public, two different things; A brand new Radiography Institute with an adjoining University, or a Grand.. Expensive and towering hunk of thin metal that is said to communicate through the very air we breathe?\n\nThen of course, Isidor chose to present his Radar Array as the main attraction.\n\nBut how does one show something.. that... nogriff can see?\n\nWhy, a demonstration of course!\n\nOf Explosive Proportions!\n\n‘Gentlegriffs and Fairmares of the Audience, I present to thee, the ability to detect.. Through the usage of waves through the very spaces between you…’\n\nDr. Isidor spread his wings out, rearing up onto his hindlegs and revealing what appeared to be a piece of thin metal with a comically red button atop it, hundreds of wires leading from it to a box underneath his podium.\n\nTwo Feathisian Polizeigriffs raised their claws in caution to their pistol holsters, undoing the safety catch as they braced for whatever this lunatic was doing. But it was too slow to deter his efforts, or even gain his attention.\n\n‘.. the ability to communicate effortlessly, and with due haste… the very asset that all creatures possess!’\n\nA silence awaited the audience, as the Doctor bent his knee and bowed to the crowd, an audible snap of the button in his claw making even the furthest observer gulp."

 zebstart.2.a:0 "Eyr protect us..."




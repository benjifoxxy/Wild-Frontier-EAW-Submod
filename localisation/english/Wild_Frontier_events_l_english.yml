 zebstart.7.t:0 "An Awkward Compromise"

 zebstart.7.d:0 "Sailing into the Great Unknown is always a challenge on the Crew of the Ship. It’s not an easy feat to convince a large group of experienced sailors to partake in a voyage from Skyfall to South Zebrika. Especially those who have families to return to, homes to maintain and a future to think of.\n\nIt typically only takes a bad omen or rumour to begin a mutiny against an already conspiratorial crew. And when the Griffs, who were promised a City of Dreams, a Grand Jewel in the midst of a Foreign mist, and are instead granted what seems to be an untamed shoreline filled to the brim with aggressive Native Zebras; convinced via their holy Goddess that they were impervious to failure as long as their cause was just. That even a bullet from a Rifle would change its trajectory if Cleo of the Kalinigo decreed it so.\n\nReality has an odd humour to it.\n\nWhen the Crew of the (Ship Name Pending) disembarked - half-starved and leaderless, their Admiral’s pompous beak hanging loose from the end of the stern and the rest of him feeding the sharks, they took it upon themselves to show the Natives of the Island that they were here to take what they deserved.\n\nWhat resulted was a week of terror, an impromptu guerilla war between Sailors turned bandits and religious zealots commanded to deter all invaders. Thousands dead, villages burned.\n\nIf not for the prompt intervention from Beakavia and Governor Isaac personally, The Mataram Cleo would have declared an eternal feud against all Griffonkind.\n\nBut as they say…"

 zebstart.7.a:0 "Money Talks, And a Friendly Smile Helps."



 zebstart.8.t:0 "Friesendam Blues"

 zebstart.8.d:0 "The Western Zebride Archipeligo is home to the twin settlements of Reigershaven and Friesendaam. As well as a significant presence of Yaneoans. They are staunchly protective of their personal rights and sponsor a program of self-reliance and co-operation with the Natives."

 zebstart.8.a:0 "We'll keep an eye on them."




 YAN_Fucked_Government_1:0 "Frozen Governate"
 YAN_Fucked_Government_1_desc:0 "With the recent devastating news of Grover V's passing, Governor Isaac and with him, the entire Government, is seemingly directionless and in a permanent state of mourning. Budgets are being neglected and the Militarstaat is directionless unless something changes."


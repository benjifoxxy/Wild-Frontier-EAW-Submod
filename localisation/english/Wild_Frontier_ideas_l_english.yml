 YAN_Beakavian_Radar_Research:0 "Beakavische Radiological Institute"
 YAN_Beakavian_Radar_Research_desc:0 "The Beakavische Radiological Institute (BRI) is a combined Research Lab and University sponsoring students of the Southeast’s education for a better tomorrow. Heading by Dr. Isidor, said by most to be eccentric and by the quiet to be plainly insane - the Institute’s presence harbours an economic boon to the Island Archipelago."


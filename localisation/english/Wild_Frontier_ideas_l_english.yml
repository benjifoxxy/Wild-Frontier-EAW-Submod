 YAN_Radar_Array_Construction_Effort:0 "Construction Effort"
 YAN_Radar_Array_Construction_Effort_desc:0 "A large National Project is currently underway in the city of Beakavia, considerable resources have been diverted to ensure it's prompt completion."

 YAN_Greifenvater_Idea:0 "A Caring Claw"
 YAN_Greifenvater_Idea_desc:0 "Given the Governership of the Zebrides after a period of extreme turmoil in the colony, Isaac's unique combination of a fatherly personality, warm rapport with the natives as well as a policy of carefully considered steady social reforms has left Governor Reigers to be seen by the people of the Zebrides as what they call the 'Griefenvater'. Time will only tell how well his approach of compromise will pay off."

 YAN_Triple_Administration_Idea:0 "Confused Administration"
 YAN_Triple_Administration_Idea_desc:0 "The islands of Talonhoek and Clawtoria both have distinct histories and vibrant cultural differences. \n\nTo the West, the Zebrikaaners proclaim a need for greater cohesion with the Native Yaneoans and further protections for the so-called Sudzebra population. A mixture hybrid of Griffische and Zebraic cultures over generations. \n\nTo the East, the Island of Talonhoek has the sponsorship of many generationally wealthy Griffon families who benefit from healthy business ties in the old Empire. \n\nIn the Centre of this debacle, is the Grand City of Beakavia. \n\nInitially established as a Trade City in a beneficial natural harbour, the settlement quickly grew into a trading hub benefitting from trade that usually would flow through the so-called gate of Nacre, much to the dismay of the Royal Family of Sambovato. \n\nAll in all, the cultural divides between the Zebridische to the East, Zebrikaaner to the West and the Sudzebras will need to be resolved sooner rather than later, if we are to avoid conflict."

 YAN_Sudzebra_Culture_Idea:0 "Südzebra Minorities"
 YAN_Sudzebra_Culture_Idea_desc:0 "The native Zebra of this nation have long suffered cultural enforcement practices from the Governate of Beakavia. A combination of punishment, stipends and language schooling has resulted in a significant portion of the population now being culturally closer to their traditional oppressors. \n\nHowever, there are many Tribezebra who stick closely to their traditions and see the Sudzebra as nothing more than cowardly collaborators. But it is hard for them to deny the allure of greater economic welfare and a comfier life is an enticing prospect for many. Which is why the programs have so far been successful."
 
 PUL_Scars_of_1004_Idea:0 "Traumatized Populace"
 PUL_Scars_of_1004_Idea_desc:0 "The Incident between the Griffons of the Skyfall Expedition and the Native §1Cubanacan§! has sewn a great distrust between the Islanders and their so called 'Protectors' in §8Beakavia§!. As a consequence, relations are heavily strained."
 
 YAN_Wild_Frontier_Idea:0 "Open Frontier"
 YAN_Wild_Frontier_Idea_desc:0 "The Investiture Zone is a vast open expanse of Lost Jungle giving way to the inner plains of Mexikstadt and Golden Columns of the Boreasgrotte. A prize for many such soldier, mercenaries or griffs looking for an adventure... "

 YAN_Rampant_Slavery_Idea:0 "Unofficial Slave Trade"
 YAN_Rampant_Slavery_Idea_desc:0 "Given the Lawless nature of the Security Zone, the only way any form of construction or progress is made, is through the blood, sweat and tears of those victimized by the Strong, because they are weak. Even those who proclaim themselves to follow the laws of the commongriff, often fall prey to the need of hoofs to work their plantations."

 YAN_Clique_Diplomacy:0 "Clique Diplomacy"
 YAN_Clique_Diplomacy_desc:0 "When all Law and Order is absent, the only motivator is the promise of distant wealth, prosperity or dreams of liberty. In such environments, many Cliques or Warlords promise the destitute the opportunity to progress over all others if they follow their lead. This breeds absolute chaos in the jungles, many different bands, some motivated by ideology, religion or even just pure wealth. Outside of the central plain of Mexikstadt, nowhere is safe."

 YAN_War_Tourism_Idea:0 "'War is Great for Business'"
 YAN_War_Tourism_Idea_desc:0 "As a result of the near constant conflict in the Investiture Zone, many businessgriffs make their fortune off of borderline illegal arms shipments to the various Cliques that put them to good use. Not only that, but a lucrative trade in so called 'War Tours' has appeared. Normally civilian richgriffs with nothing better to do and seemingly infinite curiosity are more than willing to purchase the rights to see death and war firsthand, for the right price.\n\nThere are also some foreign Mercenary Groups, such as the Talon Company and the Aquilean Foreign Legion have made their money through.. less than regular means."

 YAN_Ignored_Slavery_Idea:0 "ignored slavery todo"
 YAN_Ignored_Slavery_Idea_desc:0 "ignored slavery desc todo"

 YAN_Corporate_Administration_Idea:0 "Mercenary Administration"
 YAN_Corporate_Administration_Idea_desc:0 "Life in Weijmardshaven is a constant struggle for survival for those without the good graces of the very apparent controlling Talon Company, who runs everything from day-to-day Administration to maintaining security and safety. This results in a consciousness that if you upset the wrong griff, you won't be around long enough to apologize."

 YAN_Talon_Company:0 "Talon Company"
 YAN_Talon_Company_desc:0 "The Talon Company is a private military contractor that operates in the Investiture Zone, providing security services and combat support to various factions."

 YAN_Beaks_At_The_Table:0 "Zaikirian-Zongolese Charter"
 YAN_Beaks_At_The_Table_desc:0 "The tiny statelet of Wiejmardshaven was granted it's rights to all trade North of the City of Madrepore. Which, while proving profitable in the long run, hopefully - has in the immediate circumstance, resulted in mass hysteria and resistance in Zaikiria and the Zongo."

 YAN_Naval_Administration_Idea:0 "Kirchau Autonomy"
 YAN_Naval_Administration_Idea_desc:0 "The island of Kirchau is under the Governorship of a rogue FNS Flottenkapitan who, during the chaos of the Compromise, took control of a flotilla of ships and took control of Kirchau, turning it into his own little slice of Paradise.\n\nThis 'Paradise' is a haven of corruption, debauchery and complete lawlessness. Only those in Ewal's good graces have any chance of anything more than simple subsistence."


 Zamine_Clique_idea:0 "Zamine Clique"
 Zamine_Clique_desc_0:0 "Edi Zamine rules his fiefdom of Wadang with an Iron Hoof tipped with Steel Talons. \n\nAny amount of dissent is silenced, quickly and even if it is allowed to fester, it's usually used to justify a crackdown. This leads to Wadang pretty much being a failed state within the Beakavian Assembly that is only functioning by fueling racial tensions and §Raspirations of conquest§."
 
 Benign_Neglect:0 "Benign Neglect"
 Benign_Neglect_desc:0 "#todo - government is very lazy and does nothing because they are incompetent but somehow it turned out okay"
 
 G_Z_Divide_NS:0 "Griffische-Zebrikaaner Divide"
 G_Z_Divide_NS_desc:0 "If it's not obvious at a glance, Griffons are not native to this land. \\\\n\\\\nBefore the arrival of Griffonian Adventurer Alexey de Ulytrice, the Zebrides were an archipeligo of uncontacted Zebraic tribes all practicing different languages and customs. \\\\n\\\\nIt was easy for the Griffons to establish the City of Beakavia and posture themselves as rulers over the natives. That being said, the Government is blatantly Griffonian-Centric and laws of the Governate discriminate against Zebras on all levels. \\\\n\\\\nThis will need to be addressed, and soon."
 
 YAN_core_last_stand:0 "The True Reality of Modern Warfare"
 YAN_core_last_stand_desc:0 "Reliance on Beakavia let the Natives not have to worry about internal rivalries. But with no established structures, and against an opponent with modern weapons - the Natives here are easily falling to radical ... and militant solutions."
 
 alone_and_confused_Radical:0 "Alone and Confused"
 alone_and_confused_Radical_desc:0 "Rising up in response to the recent privatization by the VOC, the Natives of the Island have risen in defiance and demand to control their own future. If these rebellions are not quashed soon, they may garner international sympathy."

 dip_isolation_Radical:0 "No Concept of Modern Diplomacy"
 dip_isolation_Radical_desc:0 "The Natives of the Island have never needed anything more than their island and their peoples. The Griffische were the ones to open them up to the world, and without the assistance of Beakavia, the Zebras here are completely isolated from the outside world."
 
 faith_in_isaac:0 "Faith in Governor Isaac"
 faith_in_isaac_desc:0 "todo, the native yaneons know that the only reason their rights have been respected has been the current leader, who is soft, once he goes, chaos will ensue"
 
 home_advantage_radical:0 "Home Advantage"
 home_advantage_radical_desc:0 "The Natives have lived in here for hundreds of years, what they lack in technology they make up for in knowledge of the land and a cohesive tribal familial spirit. Displacing them will be difficult without use of modern technologies."
 
 language_issue_NS:0 "Language Issues"
 language_issue_NS_desc:0 "#todo - government has to produce decrees in three languages"
 
 zebrides_mission:0 "Cultural Tensions"
 zebrides_mission_desc:0 "#todo - country has three racial divides, Griffische, loyal Griffons to Griffonia, Zebrikaans, loyal to Zebrikaaners (Griffons that are cultural mix but racially Griffon) and Yaneoan, Native Zebras to the islands."
 
 VOC_Base_Shareholders:0 "Company Shareholders"
 VOC_Base_Shareholders_desc:0 "The Vereenigde Oost-Griffische Compagnie was founded on the principle that Capital is the be all, end all of all discussion. \\\\n\\\\nRun by multiple families with inherited fortunes, many of them choose to live back in Griffonia Proper rather than on the Island. This results in a capital outflow that is worrying many of the VOC Administrators. Many of them propose simply severing the contract and going it out alone, but being currently reliant on supply ships from Skyfall and Feathisia makes this prospect seem almost like a death wish."

 VOC_Base_Mercs:0 "No Standing Army"
 VOC_Base_Mercs_desc:0 "The Company has no Armed Forces of any kind, all permanent residents of the Island are 'Employees' and their servants. So in order to keep order, Mercenaries function as a solution. \\\\n\\\\n§RFor now.§!"
 
 VOC_Base_Aspirations:0 "The Art of the Deal"
 VOC_Base_Aspirations_desc:0 "Much to the dismay of neighbouring nations, the VOC is a profiteering nation and they know how to secure a good trade. Often they will be seen blatantly selling weapons to both sides of a civil war, but you don't shoot the salesman, §Hbecause without them, you can't kill your enemies.§!"
 
 Zamine_Idea_1:0 "Zebrikaaner Instructors"
 Zamine_Idea_1_desc:0 "§HZebrikaaner Instructors§! 'assist' the Military Junta of Edi Zamine. But in reality, they are either spies filtering information back to the Central Government of Beakavia or engaging in blatant corruption. Resulting in a generally better army overall, but not as effective as it could be."
 
 Zamine_Idea_2:0 "Native Exploitation"
 Zamine_Idea_2_desc:0 "The Natives here are being blatantly exploited by their overall ruler, often ignoring directives from Beakavia regarding their behaviour. Quite simply. §RThe Weak Should Make Way For The Strong.§"
 
 CER_Idea_1:0 "Ceramian Naivety"
 CER_Idea_1_desc:0 "Ceram has avoided much controversy in Beakavian Politics due to it's relatively friendly people. However, this naivety has led to shady figures taking an interest."
 
 MIZ_Idea_1:0 "Pressed Sailors"
 MIZ_Idea_1_desc:0 "Due to the obsession of Admiral Ewal, many of the Natives under his §R'Care'§! have been forced into Naval Service of what is pretty much, a Pirate Fleet but unofficially responsible for protecting trade routes. He maintains an iron hoof over all matters of the Sea and the lives of his motley crew."
 
 Hospitaller_Idea_1:0 "Protectors of the Weak"
 Hospitaller_Idea_1_desc:0 "The Griffons of the Order see themselves as protectors of the innocent. Be it a Zebra, Griff or Giraffe they will patrol the coasts with their meagre fleet and take in any refugees. Often recruiting them as auxilaries for further incursions or merely acting in charity. \\\\n\\\\nThis of course means there is virtually no industry or agriculture on the island to speak of, as the entire land is devoted to this goal. So the Order is entirely reliant on it's benefactors in Beakavia."
 
 Hospitaller_Idea_2:0 "Sword of Boreas"

 Hospitaller_Idea_3:0 "Blessing of Eyr"
 
 Hospitaller_Idea_4:0 "Shield of Arcturius"
 
 Hospitaller_Idea_5:0 "Military State"
 Hospitaller_Idea_6:0 "The Free Griffs"

 Cleo_Idea_1:0 "The Healer Mother of the Pulapi"
 Cleo_Idea_1_desc:0 "Cleo is seen as a Mother of her people, having been the one to routinely negotiate with Beakavia regarding their autonomy, she is a guiding voice and will never ask others to do something she would not do herself."
 
 Cleo_Idea_2:0 "Priority Support from Beakavia"
 Cleo_Idea_2_desc:0 "Cleo has received priority support from the Central Government of Beakavia, which has helped her maintain her position and influence."
 
 Cleo_Idea_3:0 "Scars of 1004"

 security_forces_snubbed:0 "Our recent decision to choose temporary economic surplus as opposed to bolstering out security forces has left our Mercenary Captains feeling alienated."
